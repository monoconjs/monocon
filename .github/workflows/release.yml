name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches all package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          versions="$(node -e "for (const p of ['./package.json','./packages/core/package.json','./packages/compiler/package.json','./packages/adapter/package.json']) { console.log(p, require(p).version) }")"
          echo "$versions"
          if echo "$versions" | awk '{print $2}' | grep -qv "^$tag$"; then
            echo "tag $GITHUB_REF_NAME does not match all package versions" >&2
            exit 1
          fi

      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:package
      - run: pnpm exec attw --pack packages/core --profile esm-only
      - run: pnpm exec attw --pack packages/compiler --profile esm-only
      - run: pnpm exec attw --pack packages/adapter --profile esm-only

      - name: Publish core, compiler and adapter
        run: pnpm --filter "@monocon/*" --filter "!@monocon/config" publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish monocon
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease
          fi
