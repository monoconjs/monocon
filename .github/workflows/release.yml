name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          monocon_version="$(node -p "require('./package.json').version")"
          cli_version="$(node -p "require('./cli/package.json').version")"
          if [ "$tag" != "$monocon_version" ] || [ "$tag" != "$cli_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package versions: monocon $monocon_version, @monocon/cli $cli_version" >&2
            exit 1
          fi

      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:package
      - run: pnpm exec attw --pack cli --profile esm-only

      - name: Publish monocon
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @monocon/cli
        run: pnpm --filter @monocon/cli publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease
          fi
